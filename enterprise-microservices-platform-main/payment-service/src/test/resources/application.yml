spring:
  datasource:
    url: jdbc:h2:mem:payments-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      auto-offset-reset: earliest

resilience4j:
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 50ms
        retry-exceptions:
          - com.sangiya.payments.payment.PaymentGatewayUnavailableException
