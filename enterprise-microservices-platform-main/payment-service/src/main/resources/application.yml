spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:file:./data/payments;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

resilience4j:
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.sangiya.payments.payment.PaymentGatewayUnavailableException
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
