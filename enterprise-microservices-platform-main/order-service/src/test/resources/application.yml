spring:
  datasource:
    url: jdbc:h2:mem:orders-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (not issuer-uri) specifically: creating this bean
          # does not eagerly fetch it, only an actual decode() call would --
          # and tests never call decode(), since
          # SecurityMockMvcRequestPostProcessors.jwt() injects a mock
          # authenticated principal directly. This value is never dialed.
          jwk-set-uri: http://localhost:9999/unused-test-jwks
